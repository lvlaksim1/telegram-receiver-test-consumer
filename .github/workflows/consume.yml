name: Telegram Update Consumer Test

on:
  repository_dispatch:
    types:
      - telegram_update

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate envelope and echo text back to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXPECTED_SOURCE: telegram
        shell: bash
        run: |
          set -euo pipefail

          test -n "${TELEGRAM_BOT_TOKEN:-}"
          test -n "${TELEGRAM_CHAT_ID:-}"

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as fh:
              event = json.load(fh)

          payload = event.get("client_payload") or {}

          if payload.get("source") != os.environ["EXPECTED_SOURCE"]:
              raise SystemExit("invalid source")

          if payload.get("schema_version") != 1:
              raise SystemExit("invalid schema_version")

          update_id = payload.get("update_id")
          if not isinstance(update_id, int):
              raise SystemExit("invalid update_id")

          incoming_chat_id = payload.get("chat_id")
          expected_chat_id = os.environ["TELEGRAM_CHAT_ID"]

          if str(incoming_chat_id) != expected_chat_id:
              raise SystemExit("chat_id mismatch")

          update = payload.get("update") or {}
          message = update.get("message") or {}
          text = message.get("text")

          if not isinstance(text, str) or not text:
              print(f"no_text_message update_id={update_id}; nothing_to_reply")
              raise SystemExit(0)

          target_chat_id = message.get("chat", {}).get("id")
          message_id = message.get("message_id")
          message_thread_id = message.get("message_thread_id")

          if target_chat_id is None or str(target_chat_id) != expected_chat_id:
              raise SystemExit("target chat mismatch")

          body = {
              "chat_id": target_chat_id,
              "text": "ответ: " + text,
          }

          if isinstance(message_id, int):
              body["reply_parameters"] = {"message_id": message_id}

          if isinstance(message_thread_id, int):
              body["message_thread_id"] = message_thread_id

          request_body = json.dumps(
              body,
              ensure_ascii=False,
          ).encode("utf-8")

          request = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data=request_body,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "telegram-receiver-test-consumer/0.1",
              },
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))

          if response.status != 200 or result.get("ok") is not True:
              raise SystemExit("Telegram sendMessage failed")

          sent = result.get("result") or {}
          sent_message_id = sent.get("message_id")
          sent_chat_type = (sent.get("chat") or {}).get("type")
          print(
              f"reply_sent update_id={update_id} "
              f"message_id={sent_message_id} chat_type={sent_chat_type} "
              f"threaded={isinstance(message_thread_id, int)}"
          )
          PY
