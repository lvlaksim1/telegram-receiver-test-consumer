name: Outbound Telegram Probe

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[OUTBOUND_TELEGRAM_PROBE]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send probe
        id: send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          body = json.dumps(
              {
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": "ответ: outbound probe",
              },
              ensure_ascii=False,
          ).encode("utf-8")

          request = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))

          if response.status != 200 or result.get("ok") is not True:
              raise SystemExit("sendMessage failed")

          message = result.get("result") or {}
          print(
              "outbound_probe_ok "
              f"message_id={message.get('message_id')} "
              f"chat_type={(message.get('chat') or {}).get('type')}"
          )
          PY

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            BODY="OUTBOUND_PROBE_OK"
          else
            BODY="OUTBOUND_PROBE_FAILED"
          fi
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments"             -f body="$BODY"
